# Vhost untuk Survei Penilaian FSM UNDIP (aplikasi baru). Mengikuti pola persis
# /etc/nginx/sites-available/survei-fsm (aplikasi lama) — nomor port dan nama host saja yang
# beda, supaya tidak bertabrakan dan tidak perlu menyentuh vhost aplikasi lama itu sama sekali.
server {
    listen 8094;
    server_name fsm.heyizza.my.id;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3930;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_set_header Connection '';
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
