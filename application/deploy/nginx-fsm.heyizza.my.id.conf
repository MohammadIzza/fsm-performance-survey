# Vhost untuk Survei Penilaian FSM UNDIP (aplikasi baru). Mengikuti pola persis
# /etc/nginx/sites-available/survei-fsm (aplikasi lama) — nomor port dan nama host saja yang
# beda, supaya tidak bertabrakan dan tidak perlu menyentuh vhost aplikasi lama itu sama sekali.
#
# Aplikasi hidup di bawah /survey (basePath Next, base Astro). Dua jalan masuk memakai vhost ini:
#   - gateway UNDIP  https://apps-fsm.undip.ac.id/survey/  → 10.137.58.132:8094/survey/ (awalan utuh)
#   - Cloudflare     https://fsm.heyizza.my.id/            → localhost:8094
# Port 8094 hanya punya server ini, jadi ia juga server bawaan untuk Host apa pun dari gateway.

# Skema asli dari gateway/Cloudflare (TLS diakhiri di sana). Tanpa header dari depan barulah
# skema koneksi ke nginx ini yang dipakai.
map $http_x_forwarded_proto $fsm_survey_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8094;
    server_name fsm.heyizza.my.id;

    client_max_body_size 10M;

    # Alih yang dibuat nginx sendiri (location / di bawah) ditulis relatif. Tanpa ini Location-nya
    # memuat skema dan port koneksi ke sini — http://…:8094/survey/ — yang tidak bisa dibuka dari luar.
    absolute_redirect off;

    # Berlaku untuk semua location proxy di bawah. Header Range tidak disentuh: nginx meneruskannya
    # apa adanya, dan Next membalas 206 untuk video tutorial.
    proxy_http_version 1.1;
    # $http_host, bukan $host: $host membuang nomor port. Next membandingkan host yang diteruskan
    # dengan header Origin dari peramban saat menerima Server Action, dan "10.137.58.138" tidak
    # pernah cocok dengan "10.137.58.138:8094" — seluruh pengiriman formulir ditolak dengan
    # "Invalid Server Actions request". Lewat gateway (tanpa port) keduanya kebetulan sama, jadi
    # kesalahan ini hanya muncul saat aplikasi dibuka langsung lewat alamat IP.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fsm_survey_forwarded_proto;
    proxy_set_header Connection '';
    proxy_read_timeout 60;

    # Beranda. Next dengan basePath membalas "/survey/" dengan alih 308 ke "/survey", sedangkan
    # gateway lazimnya mengalihkan "/survey" ke "/survey/" — keduanya bersama jadi putaran alih tanpa
    # akhir. Di sini "/survey/" diteruskan ke Next sebagai "/survey", jadi keduanya langsung 200.
    location = /survey/ {
        proxy_pass http://127.0.0.1:3930/survey$is_args$args;
    }

    location = /survey {
        proxy_pass http://127.0.0.1:3930;
    }

    # Path diteruskan apa adanya (proxy_pass tanpa URI) — awalan /survey tidak dibuang.
    location /survey/ {
        proxy_pass http://127.0.0.1:3930;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Di luar /survey tidak ada apa-apa lagi. Alamat lama tanpa awalan (tautan fsm.heyizza.my.id
    # yang sudah tersebar, mis. /login) dialihkan ke padanannya di bawah /survey.
    location / {
        return 302 /survey$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
